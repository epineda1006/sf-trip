<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FBFBFD" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SF Trip">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<title>SF Trip</title>
<style>
:root{
  --bg:#000; --bg2:#121215; --fg:#FAFAFC; --hi:#FFF; --dim:#B4B4BB; --faint:rgba(255,255,255,.14); --rule:rgba(255,255,255,.24);
  --pg:#FF6B4A; --on-pg:#000; --md:#FFFFFF; --on-md:#000; --band:color-mix(in srgb,#FFF 8%,transparent); --warn:#FFD60A; --ok:#30D158; --time:#FFD60A;
  --glass-tint:rgba(28,28,32,0); --spec:rgba(255,255,255,.22); --spec-lo:rgba(0,0,0,.4); --rim:rgba(255,255,255,.18); --drop:rgba(0,0,0,.55);
  --display:-apple-system,"SF Pro Display",BlinkMacSystemFont,"Helvetica Neue",system-ui,sans-serif;
  --text:-apple-system,"SF Pro Text",BlinkMacSystemFont,"Helvetica Neue",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#FBFBFD; --bg2:#F2F2F5; --fg:#1D1D1F; --hi:#000; --dim:#515157; --faint:rgba(29,29,31,.1); --rule:rgba(29,29,31,.22);
  --pg:#C0391B; --on-pg:#FFF; --md:#111114; --on-md:#FFF; --band:#E2E2E8; --warn:#8A6500; --ok:#1A7F37; --time:#8A6500;
  --glass-tint:rgba(251,251,253,.02); --spec:rgba(255,255,255,.95); --spec-lo:rgba(0,0,0,.06); --rim:rgba(0,0,0,.08); --drop:rgba(0,0,0,.12);
  color-scheme:light;}}
:root[data-theme="light"]{
  --bg:#FBFBFD; --bg2:#F2F2F5; --fg:#1D1D1F; --hi:#000; --dim:#515157; --faint:rgba(29,29,31,.1); --rule:rgba(29,29,31,.22);
  --pg:#C0391B; --on-pg:#FFF; --md:#111114; --on-md:#FFF; --band:#E2E2E8; --warn:#8A6500; --ok:#1A7F37; --time:#8A6500;
  --glass-tint:rgba(251,251,253,.02); --spec:rgba(255,255,255,.95); --spec-lo:rgba(0,0,0,.06); --rim:rgba(0,0,0,.08); --drop:rgba(0,0,0,.12);
  color-scheme:light;}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--text);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  transition:background-color .4s var(--ease),color .4s var(--ease)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px),4vw);padding-right:max(16px,env(safe-area-inset-right,0px),4vw)}
:focus-visible{outline:2px solid var(--pg);outline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
main{padding-bottom:130px;min-height:100vh}
[hidden]{display:none!important}
button,a,label,input{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
/* Phone first, tuned for a 402pt-wide iPhone Pro screen */
@media (max-width:560px){
  body{font-size:15.5px}
  .btn{padding:10px 15px;font-size:14px;min-height:40px}
  .mood{padding:10px 14px;font-size:12.5px}
  .info{width:32px;height:32px}
  .info svg{width:16px;height:16px}
  .pill{padding:3px}
  .pill button{padding:9px 11px;font-size:13px}
  .round{width:42px;height:42px}
  .tabbar button{min-width:78px;padding:8px 12px}
  .tabbar b{font-size:17px}
  .meta{grid-template-columns:1fr 1fr}
  .stop h3{font-size:22px}
  .alts .ab .btn{flex:1;justify-content:center}
  .checks label{padding:14px 0}
  .checks input{width:24px;height:24px}
  .stepper button{width:40px;height:40px}
  .line{padding-left:30px}
  .line::before{left:8px}
  .stop::before{left:-29px}
}

.fglass{background:var(--glass-tint);-webkit-backdrop-filter:blur(5px) saturate(150%);backdrop-filter:blur(5px) saturate(150%);
  box-shadow:inset 0 1px 0 color-mix(in srgb,var(--spec) 45%,transparent),inset 0 -1px 0 color-mix(in srgb,var(--spec-lo) 35%,transparent),
  inset 0 0 0 .5px var(--rim),0 10px 28px -16px color-mix(in srgb,var(--drop) 35%,transparent)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;justify-content:center;align-items:center;gap:8px;padding-block:10px}
.pill{display:flex;gap:2px;padding:4px;border-radius:999px;overflow-x:auto;scrollbar-width:none;max-width:calc(100% - 46px)}
.pill::-webkit-scrollbar{display:none}
.pill button{flex:none;border:0;background:none;border-radius:999px;padding:7px 12px;font:600 13px var(--display);color:var(--dim);transition:color .2s var(--ease),background .2s var(--ease)}
.pill button[aria-current]{color:var(--on-pg);background:var(--pg);box-shadow:none}
.round{flex:none;width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;background:none}
.round svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
@media (max-width:520px){.pill button{padding:7px 9px;font-size:12.5px}}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,calc(env(safe-area-inset-bottom,0px) + 6px));z-index:55;display:flex;gap:2px;padding:4px;border-radius:999px}
.tabbar button{border:0;background:none;border-radius:999px;min-width:64px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--dim)}
.tabbar b{font:700 15px var(--display);letter-spacing:-.02em}
.tabbar span{font:600 10.5px var(--text)}
.tabbar button[aria-current]{color:var(--on-pg);background:var(--pg)}
.tabbar button[aria-current] b{color:var(--on-pg)}

.mrow{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 18px;font:500 11.5px var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.06em;padding-bottom:12px;border-bottom:1px solid var(--rule)}
.giant{font:700 clamp(34px,5vw,64px)/.95 var(--display);letter-spacing:-.05em;margin:16px 0 0;color:var(--hi);text-wrap:balance}
.giant em{font-style:normal;color:var(--pg)}
.lede{font:400 clamp(16px,1.5vw,19px)/1.35 var(--display);color:var(--dim);max-width:46ch;margin:12px 0 0;letter-spacing:-.01em}
.big{font:700 clamp(26px,3.4vw,44px)/1 var(--display);letter-spacing:-.04em;margin:10px 0 0;color:var(--hi)}
.mid{font:650 clamp(19px,2vw,24px)/1.15 var(--display);letter-spacing:-.025em;margin:0;color:var(--hi)}
.hero{padding-block:clamp(26px,5vw,64px) 8px}
.sect{padding-block:clamp(26px,4.5vw,56px)}
.sect+.sect{border-top:1px solid var(--rule)}
.facts{list-style:none;margin:18px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 24px;max-width:900px}
.facts li{padding:11px 0;border-top:1px solid var(--rule)}
.facts span{display:block;font:500 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--dim)}
.facts b{display:block;margin-top:3px;font:600 16px/1.25 var(--display);color:var(--hi)}
.facts a{text-decoration:none}

.moods{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.moods .lbl3{width:100%;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.mood{border:0;background:none;font:500 12px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--dim);padding:7px 12px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--rule);transition:all .2s var(--ease)}
.mood[aria-pressed="true"]{color:var(--on-md);background:var(--md);box-shadow:none}
.moodhint{margin-top:10px;font-size:13.5px;color:var(--dim)}

.line{position:relative;margin-top:26px;padding-left:34px}
.line::before{content:"";position:absolute;left:10px;top:8px;bottom:8px;width:4px;border-radius:2px;background:var(--pg)}
.stop{position:relative;padding:4px 0 30px}
.stop:last-child{padding-bottom:4px}
.stop::before{content:"";position:absolute;left:-31px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 3.5px var(--pg);transition:background .2s var(--ease)}
.stop.rest::before{box-shadow:0 0 0 3.5px var(--dim)}
.stop.done::before{background:var(--pg)}
.stop.fits::before{box-shadow:0 0 0 3.5px var(--md)}
.stop.fits h3 .namebtn{color:var(--md)}
.stop.done .body{opacity:.5}
.tagrow{display:flex;flex-wrap:wrap;gap:4px 14px;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.tagrow .t{color:var(--pg);font-weight:700}
.tagrow .fit{color:var(--on-md);background:var(--md);border-radius:999px;padding:0 7px}
.stop h3{margin:6px 0 0;font:650 clamp(19px,2vw,26px)/1.12 var(--display);letter-spacing:-.03em;color:var(--hi)}
.stop .sub{margin:2px 0 0;font:500 11.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--dim)}
.stop p{margin:6px 0 0;color:var(--dim);max-width:64ch}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px 18px;margin-top:10px;font-size:13.5px;max-width:760px}
.meta span{color:var(--fg)}
.meta i{font-style:normal;display:block;color:var(--dim);font:500 10.5px var(--mono);letter-spacing:.05em;text-transform:uppercase}
.note{border-left:2px solid var(--pg);padding:2px 0 2px 12px;margin-top:12px;font-size:13.5px;max-width:64ch}
.note.warn{border-color:var(--warn)}
.note.ok{border-color:var(--ok)}
.note .lbl{display:block;font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--pg)}
.note.warn .lbl{color:var(--warn)}
.note.ok .lbl{color:var(--ok)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{border:0;background:none;font:600 13px var(--text);padding:7px 14px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--rule);color:var(--hi);text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.pri{background:var(--pg);color:var(--on-pg);box-shadow:none}
.btn[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--pg);color:var(--pg)}
.btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.alts{list-style:none;margin:10px 0 0;padding:0;max-width:760px}
.alts li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--rule);transition:box-shadow .2s var(--ease),padding .2s var(--ease)}
.alts li:last-child{border-bottom:1px solid var(--rule)}
.alts .n{font:600 15px/1.3 var(--display);color:var(--hi)}
.alts .s{grid-column:1;font:500 11px/1.45 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--dim)}
.alts .d{grid-column:1;font-size:13px;color:var(--dim)}
.alts .ab{grid-row:1/span 3;grid-column:2;display:flex;gap:6px}
.alts li.hi{box-shadow:inset 3px 0 0 var(--md);padding-left:12px;background:var(--band)}
/* light mode: charcoal band behind stops that fit the mood */
:root[data-theme="light"] .stop.fits{background:#ECECF0;box-shadow:0 0 0 10px #ECECF0;border-radius:2px;padding-bottom:16px;margin-bottom:14px}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .stop.fits{background:#ECECF0;box-shadow:0 0 0 10px #ECECF0;border-radius:2px;padding-bottom:16px;margin-bottom:14px}}
:root[data-theme="light"] .alts li.hi .n,:root[data-theme="light"] .alts li.hi .namebtn{font-weight:700}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .alts li.hi .n,:root:not([data-theme="dark"]) .alts li.hi .namebtn{font-weight:700}}
.alts li.hi .n,.alts li.hi .namebtn{color:var(--md)}
.lbl2{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-top:18px}
.cv{color:var(--warn)}
.info{border:0;background:none;width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--rule);display:inline-grid;place-items:center;color:var(--pg);vertical-align:middle;margin-left:6px;padding:0}
.info svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.namebtn{border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.leg{display:inline-flex;align-items:center;gap:6px;margin:0 0 8px;font:500 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--dim)}
.leg b{color:var(--fg);font-weight:600}
.leg svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.back{margin-top:4px}
.blist{list-style:none;margin:12px 0 0;padding:0;max-width:760px}
.blist li{padding:10px 0 10px 18px;border-top:1px solid var(--rule);position:relative}
.blist li:last-child{border-bottom:1px solid var(--rule)}
.blist li::before{content:"";position:absolute;left:2px;top:18px;width:7px;height:7px;border-radius:50%;background:var(--pg)}
.okc{color:var(--ok)}
.row .pr{flex:none;font:700 12px var(--mono);color:var(--fg);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.row .pr.paid{color:var(--ok)}
.st2.done .row .pr{color:var(--dim)}
.chip.paidc{color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.jump{margin-top:18px}
.jump .chip{text-decoration:none;color:var(--fg)}
.sect[id^="pc-"]{scroll-margin-top:70px}
.alts .ab{flex-wrap:wrap;justify-content:flex-end}
.alts .ab .picked{white-space:nowrap}
.alts.pl li{grid-template-columns:minmax(0,1fr)}
.alts.pl .ab{grid-row:auto;grid-column:1;justify-content:flex-start;margin-top:6px}
.alts.pl .ab .picked{display:inline-flex;align-items:center}
@media (max-width:520px){.alts.pl .ab .btn{flex:none}}
@media (max-width:520px){.alts li{grid-template-columns:1fr}.alts .ab{grid-row:auto;grid-column:1;margin-top:6px}}

.rnow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.rnow .btn.big{font-size:15px;padding:12px 18px}
.rtip{margin:10px 0 0;font-size:13px;color:var(--dim);max-width:60ch}
.rdir{margin:12px 0 4px}
.crow{margin-top:14px}
.crow .mood{font-size:11.5px}
.cfrom{margin:12px 0 2px}
.alts .eat{grid-column:1;font-size:13.5px;color:var(--fg)}
.alts .eat b{font-weight:600}
.parkhow{margin-top:6px;font-size:13px}
.rdir button{border:0;background:none;color:var(--dim);font:600 12.5px var(--text);padding:6px 12px;border-radius:999px;min-height:36px}
.rdir button[aria-pressed="true"],.cfrom button[aria-pressed="true"]{background:var(--pg);color:var(--on-pg)}
.alts li.altr .n{color:var(--dim)}
/* accents on tab pages */
.mrow>span:first-child{color:var(--pg);font-weight:700}
.sect .alts .s{color:var(--time)}
.sect .alts .s .cv{display:inline-block;background:var(--warn);color:var(--bg);border-radius:999px;padding:0 7px;font-weight:700}
.sect .alts .s .okc{display:inline-block;color:var(--ok);font-weight:700}
.sect .alts .btn svg,.rnow .btn:not(.pri) svg{stroke:var(--pg)}
.alts .num{display:inline-grid;place-items:center;width:22px;height:22px;margin-right:9px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--pg);color:var(--pg);font:700 11px var(--mono);font-style:normal;vertical-align:1px}
.alts li.altr .num{box-shadow:inset 0 0 0 2px var(--dim);color:var(--dim)}
/* ---------- day at a glance ---------- */
.glance{margin-top:22px;max-width:780px}
.gap{display:flex;align-items:center;gap:10px;padding:10px 0;font:700 15px var(--text);color:var(--hi);border-top:1px solid var(--rule)}
.gap .ic{flex:none;width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--pg);display:grid;place-items:center}
.gap svg{width:14px;height:14px;fill:none;stroke:var(--pg);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.gap .fr{font-weight:500;font-size:13px;color:var(--dim)}
.st2{border-top:1px solid var(--rule);padding:4px 0}
.gap+.st2{border-top:0}
.st2.next{background:var(--bg2);border-radius:14px;padding:6px 10px;margin:2px -10px}
.row{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:8px 0;text-align:left;min-height:52px}
.row .tm{flex:none;width:64px;font:700 12px var(--mono);color:var(--time);letter-spacing:.02em}
.row .nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .lb{font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.row .lb i{font-style:normal;border-radius:999px;padding:0 6px;margin-left:4px;font-weight:700}
.row .nx{background:var(--pg);color:var(--on-pg)}
.row .ft{background:var(--md);color:var(--on-md)}
.row .ft.o{background:none;color:var(--md);box-shadow:inset 0 0 0 1px var(--md)}
.row b{font:650 16px/1.25 var(--display);letter-spacing:-.015em;color:var(--hi);overflow-wrap:anywhere}
.st2.fits .row b{color:var(--md)}
.st2.done .row b{color:var(--dim);text-decoration:line-through;text-decoration-thickness:1px}
.st2.done .row .tm{color:var(--dim)}
.dot{flex:none;width:9px;height:9px;border-radius:50%}
.dot.w{background:var(--warn)}.dot.k{background:var(--ok)}
.chev{flex:none;color:var(--dim);display:grid;place-items:center}
.chev svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s var(--ease)}
.st2.open .chev svg{transform:rotate(180deg)}
.first{margin:0 0 8px 76px;font-size:13px;color:var(--fg);display:flex;gap:8px;align-items:baseline}
.first b,.fz{flex:none;font:700 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--warn)}
.exp{display:none;padding:0 0 12px 76px}
.st2.open .exp{display:block}
.exp .key{margin:0;color:var(--fg);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font:600 12px var(--text);padding:3px 10px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--rule);color:var(--fg)}
.ln{margin:6px 0 0;font-size:13px;color:var(--dim)}
.ln i{font-style:normal;font:700 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-right:8px}
.ln.w i{color:var(--warn)}.ln.k i{color:var(--ok)}
.exp .acts{margin-top:12px}
.swd{margin-top:12px}
.swd summary{cursor:pointer;list-style:none;font:600 13px var(--text);color:var(--pg);min-height:36px;display:inline-flex;align-items:center;gap:6px}
.swd summary::-webkit-details-marker{display:none}
.swd summary::after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px)}
.swd[open] summary::after{transform:rotate(-135deg) translateY(-1px)}
.swd .alts{margin-top:4px}
:root[data-theme="light"] .st2.fits{background:#ECECF0;border-radius:14px;padding:4px 10px;margin:2px -10px}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .st2.fits{background:#ECECF0;border-radius:14px;padding:4px 10px;margin:2px -10px}}
@media (max-width:560px){
  .row .tm{width:58px;font-size:11.5px}
  .row b{font-size:16.5px}
  .first{margin-left:0}
  .exp{padding-left:0}
  .exp .acts .btn{padding:9px 13px}
}

.nums{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 40px;margin-top:18px}
.nums b{display:block;font:700 clamp(36px,4.2vw,60px)/1 var(--display);letter-spacing:-.05em;font-variant-numeric:tabular-nums;color:var(--hi)}
.nums b.over{color:var(--warn)}
.nums span{display:block;margin-top:6px;color:var(--dim);font-size:13.5px}
.track{height:4px;border-radius:2px;background:var(--faint);margin-top:18px;max-width:760px;overflow:hidden}
.track i{display:block;height:100%;background:var(--pg);transition:width .4s var(--ease)}
.track i.over{background:var(--warn)}
.rows{list-style:none;margin:16px 0 0;padding:0;max-width:760px}
.rows li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--rule);font-variant-numeric:tabular-nums}
.rows li:last-child{border-bottom:1px solid var(--rule)}
.rows small{display:block;color:var(--dim);font-size:12.5px;line-height:1.4}
.rows b{color:var(--hi);font-weight:600;white-space:nowrap}
.rows.links a{color:var(--fg);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule)}
.rows.links span{color:var(--dim)}
.lnk{background:none;border:0;padding:0;margin-left:4px;font:inherit;font-weight:600;color:var(--pg);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.rows .tot b{color:var(--pg);font-size:17px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:30px;height:30px;border-radius:50%;border:0;box-shadow:inset 0 0 0 1px var(--rule);background:none;font:600 16px var(--display);color:var(--hi)}
.cap{margin-top:10px;font-size:13px;color:var(--dim);max-width:64ch}

.checks{list-style:none;margin:14px 0 0;padding:0;max-width:760px}
.checks li{border-top:1px solid var(--rule)}
.checks li:last-child{border-bottom:1px solid var(--rule)}
.checks label{display:flex;gap:12px;align-items:flex-start;padding:12px 0;cursor:pointer}
.checks input{appearance:none;-webkit-appearance:none;flex:none;width:20px;height:20px;margin:2px 0 0;border-radius:6px;box-shadow:inset 0 0 0 1.5px var(--rule);display:grid;place-items:center;cursor:pointer}
.checks input:checked{background:var(--pg);box-shadow:none}
.checks input:checked::after{content:"";width:9px;height:5px;border:solid var(--on-pg);border-width:0 0 2px 2px;transform:rotate(-45deg) translate(1px,-1px)}
.checks input:checked+span{color:var(--dim);text-decoration:line-through}
.checks a{color:var(--pg)}
.count{font:500 11.5px var(--mono);letter-spacing:.06em;color:var(--dim);margin-top:8px}

.meal{margin-top:26px}
.meal .mrow{border-bottom:0;padding-bottom:0}
.tier{display:inline-block;font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:1px 8px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--rule);color:var(--dim);margin-right:6px;vertical-align:1px}
.tier.treat{color:var(--pg);box-shadow:inset 0 0 0 1px var(--pg)}
.picked{font:700 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--on-pg);background:var(--pg);border-radius:999px;padding:5px 11px}

.secret{margin-top:26px;max-width:760px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.secret summary{list-style:none;padding:13px 0;cursor:pointer;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between}
.secret summary::-webkit-details-marker{display:none}
.secret summary::after{content:"Show"}
.secret[open] summary::after{content:"Hide"}
.secret .in{padding:0 0 16px}
.foot{margin-top:34px;font-size:12.5px;color:var(--dim);max-width:64ch}
.rv{animation:rv .5s var(--ease) both}
@keyframes rv{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (prefers-reduced-transparency:reduce){.fglass{background:var(--bg2);-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (prefers-contrast:more){:root{--rule:rgba(255,255,255,.5);--dim:#D6D6DB}}
</style>

});
render();
})();
</script>
